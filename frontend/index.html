<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Telosia shows what your work does to bodies like yours, and where other women in your job went next. Free, no account, built from published Australian injury and mobility data." />
    <title>Telosia — Map the risk. Move with purpose.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('telosia-theme')
        if (t !== 'dark' && t !== 'hc') { t = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light' }
        if (t === 'dark') document.documentElement.classList.add('dark')
        if (t === 'hc') document.documentElement.classList.add('hc')
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light') }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
